# AURA — AWS free-tier topology (single t3.micro, 1 GB RAM)
#
# This is NOT docker-compose.prod.yml with fewer services. Three deliberate
# differences, each forced by the 1 GB ceiling:
#
#   1. ONE worker, not four. docker-compose.prod.yml runs the gateway with
#      --workers 4; every worker imports pandas + numpy + duckdb + langgraph
#      into its own address space (~250 MB each), so four workers OOM the box
#      before the health check ever passes. With no users, one worker is also
#      genuinely sufficient.
#   2. SQLite, not Postgres. The `db` service is dropped entirely — RDS is the
#      single largest cost item and a Postgres container is ~200 MB of RAM we
#      do not have. persistence.py already supports SQLite (it is the dev
#      default), so this is a config change, not a code change.
#   3. TWO tiers, not one. The gateway runs causal-runtime because the
#      dowhy/econml estimators live there; on base it degraded to the single
#      dependency-free estimator (IV) and rated its own jobs low confidence.
#      Measured cost of the switch: gateway 210MiB -> ~390MiB, peak 402MiB of
#      its 520m ceiling, no OOM. uasr_service stays on base (numpy only), so
#      only one container pays for the causal wheels.
#
# The other eight services are absent, not disabled. The counterfactual and
# financial-audit engines run IN-PROCESS inside the gateway (see CLAUDE.md), so
# the analyst path and the audit path both work without them. Features that DO
# require a missing service (external-DB connectors, distributed scheduler) are
# listed honestly in README.md rather than left to fail at runtime.

name: aura

# Must match what .github/workflows/cd.yml actually publishes, which is not
# obvious from reading it: IMAGE_NAME is ${{ github.repository }} (so the image
# is <owner>/aura, NOT aura-backend), and `flavor: suffix=-<matrix.suffix>`
# appends the tier — so target `base-runtime` publishes the tag `-base`, not
# `-base-runtime`. Tag v0.1.0 therefore yields:
#     ghcr.io/third-i-ai/aura:0.1.0-base
# GHCR lowercases the whole path, so GHCR_OWNER must be lowercase too.
x-image: &image ghcr.io/${GHCR_OWNER}/aura:${AURA_TAG}-base

services:
  api_gateway:
    # CAUSAL tier, not base: the base image ships numpy only, so double_ml
    # (dowhy) and tmle (sklearn) could not run and all 4 refuters skipped —
    # the engine degraded per-estimator to IV alone and self-rated the job
    # low confidence. Measured on this box after switching: 3/3 estimators
    # and 4/4 refuters run, confidence high, gateway peak 402MiB of its
    # 520m ceiling, no OOM kill, no restart. uasr_service stays on base —
    # it imports numpy and nothing heavier.
    image: ghcr.io/${GHCR_OWNER}/aura:${AURA_TAG}-causal
    restart: unless-stopped
    # One worker. See note 1 above — this is the difference between booting
    # and OOM-looping on a t3.micro.
    command: uvicorn api_gateway.main:app --host 0.0.0.0 --port 8000 --workers 1
    env_file: [.env]
    environment:
      # SQLite lives on the mounted volume so it survives container replacement.
      #
      # EVERY NAME HERE IS LOAD-BEARING AND SPELLED TO MATCH THE CODE. An env
      # var the code does not read is not an error — it is silently ignored,
      # the default wins, and the state lands inside the container where the
      # next `compose pull` deletes it. Two names were wrong on the first
      # deploy (AURA_DATABASE_URL and AURA_UPLOAD_DIR, both invented, matching
      # nothing), so each now cites its reader:
      #   persistence.py database_url()        -> GATEWAY_DATABASE_URL
      #   metadata_store/db.py                 -> METADATA_DATABASE_URL
      #   routers/workspaces.py _UPLOADS_ROOT  -> AURA_UPLOADS_ROOT
      # Before adding one, grep the backend for the literal name.
      GATEWAY_DATABASE_URL: sqlite+aiosqlite:////data/state/gateway.db
      AURA_LEDGER_DATABASE_URL: sqlite+aiosqlite:////data/state/ledger.db
      # USER ACCOUNTS live here — metadata_store/db.py reads this var and
      # otherwise defaults to metadata.db inside the CONTAINER filesystem.
      # Omitting it silently destroys every registered user on any restart or
      # image update: registration returns 201, then the next `compose up`
      # replaces the container and login answers "Invalid credentials" with no
      # error anywhere explaining why. Found exactly that way on the live box.
      METADATA_DATABASE_URL: sqlite+aiosqlite:////data/state/metadata.db
      AURA_AUDIT_DIR: /data/audit
      AURA_ARTIFACT_DIR: /data/artifacts
      AURA_SIGNING_KEY_DIR: /data/keys
      # Every dataset a user uploads. Tenant-scoped as <root>/<workspace>/<file>.
      AURA_UPLOADS_ROOT: /data/uploads
      # Reaches the uasr_service container below. The code default is
      # http://localhost:8009, which inside this container is the gateway
      # itself — every /uasr/* call then fails to connect.
      AURA_UASR_URL: http://uasr_service:8009
    volumes:
      - aura-data:/data
    # Hard ceiling. Without it a runaway pandas operation takes the whole box
    # down including Caddy, and you lose the ability to reach the site at all.
    # Trimmed from 700m to make room for uasr_service: the box has 916m total,
    # and observed gateway usage is ~240m, so 520m is still >2x headroom.
    mem_limit: 520m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      # ML imports are slow on a burstable instance; a short start_period would
      # kill the container mid-import and loop forever.
      start_period: 180s
      retries: 3

  # ── UASR — self-healing MAPE-K loop ──────────────────────────────────
  # Without this the seven /uasr/* gateway routes have nothing to reach and
  # answer 503: the self-healing pillar is shipped code that no deployment
  # actually runs. It fits here because uasr/* imports numpy and nothing
  # heavier, so it reuses the SAME base image rather than needing its own.
  #
  # Single-node on purpose. The prod compose runs redis + postgres for
  # distributed repair admission; runtime_config's defaults (state=memory,
  # repair=local) have no redis dependency at all, which is what makes a
  # 1 GB box viable.
  uasr_service:
    image: *image
    restart: unless-stopped
    command: uvicorn uasr.service:app --host 0.0.0.0 --port 8009 --workers 1
    env_file: [.env]
    environment:
      # UASR's own tables, NOT the gateway's metadata.db. uasr/db.py reuses
      # metadata_store's engine, so this var decides where its tables live;
      # pointing it at the gateway's file would put two processes behind one
      # SQLite writer for no benefit — the gateway reaches UASR over HTTP and
      # never reads these tables (verified: no RecoveryRecord / DriftEvent /
      # HealingMetric reference anywhere under api_gateway/).
      METADATA_DATABASE_URL: sqlite+aiosqlite:////data/state/uasr.db
      # Drift baselines and batch snapshots. On the volume for the same reason
      # everything else is: a container-local path is deleted by compose pull,
      # and a self-healer that forgets its baseline on every deploy re-learns
      # "normal" from scratch and cannot detect drift across a release.
      UASR_DUCKDB_PATH: /data/state/uasr.duckdb
      UASR_PARQUET_DIR: /data/uasr_parquet
      UASR_MAPEK_ENABLED: "true"
    volumes:
      - aura-data:/data
    mem_limit: 220m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8009/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  frontend:
    # Published by cd.yml's build-and-push-frontend job, which was added when
    # this deploy was wired — before that, no frontend image existed at any tag.
    image: ghcr.io/${GHCR_OWNER}/aura:${AURA_TAG}-frontend
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      api_gateway:
        condition: service_healthy

  # Caddy terminates TLS with an automatic Let's Encrypt certificate. This is
  # not optional polish: shared/config.py REJECTS a non-HTTPS CORS origin in
  # production, so an http:// deploy refuses to boot by design. Caddy is how we
  # keep every production guard armed instead of weakening one to get online.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    mem_limit: 64m
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      AURA_DOMAIN: ${AURA_DOMAIN}
    depends_on: [frontend, api_gateway]

volumes:
  aura-data:
  caddy-data:
  caddy-config:
