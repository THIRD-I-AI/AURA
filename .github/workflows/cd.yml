name: CD (Build & Push to GHCR)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Converts repository name (e.g. USER/repo) to lowercase for GHCR
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    
    # Needs permissions to push to GitHub Container Registry
    permissions:
      contents: read
      packages: write
    
    strategy:
      fail-fast: false
      matrix:
        target: [base-runtime, causal-runtime, streaming-runtime]
        include:
          - target: base-runtime
            suffix: base
          - target: causal-runtime
            suffix: causal
          - target: streaming-runtime
            suffix: streaming

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          # image name e.g., ghcr.io/mouni/aura
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
          flavor: |
            latest=false
            suffix=-${{ matrix.suffix }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./aurabackend
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  # The backend job's context is ./aurabackend, so nothing here ever built the
  # React app — any deployment referencing a frontend image was pointing at a
  # tag that does not exist. Caught while wiring deploy/aws-free-tier, where the
  # instance pulls rather than builds (a 1 GB t3.micro cannot run `npm ci`).
  build-and-push-frontend:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        # Same image repository as the backend tiers, distinguished only by the
        # tag suffix — matching the -base/-causal/-streaming convention above so
        # one pull credential covers every artifact of a release.
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
          flavor: |
            latest=false
            suffix=-frontend

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
