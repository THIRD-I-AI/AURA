server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend gateway. No trailing slash on
    # proxy_pass so the /api/v1 prefix is PRESERVED (a trailing slash would
    # rewrite /api/v1/x -> /v1/x and 404 at the gateway). SSE endpoints live
    # under /api/v1/ too, so buffering is disabled here for streaming to work.
    location /api/ {
        proxy_pass http://api_gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # Collab WebSocket relay (mounted at root on the gateway, not /api/v1).
    location /ws/ {
        proxy_pass http://api_gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # BUG-342: index.html went out with no Cache-Control at all, so a browser could
    # reuse an old copy -- pointing at the previous build's bundle -- for hours or
    # days after a deploy, and every .js/.css/.png/.svg (including the un-hashed
    # files in public/) was marked immutable for 30 days. Only Vite's
    # content-hashed /assets/ files can safely be cached forever; the page itself
    # is revalidated on every load.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|webmanifest)$ {
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
